name: Release

# Publishes a Docker image and attaches the jar and the browser extension to a GitHub release, so
# the project can be used without a Java toolchain.
#
# Tag a commit to publish:  git tag v1.0.0 && git push origin v1.0.0
#
# The first run creates a private package. Make it public once, under
# github.com/users/<you>/packages, or `docker run` will ask strangers to authenticate.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach artifacts to the release
  packages: write # push to GitHub Container Registry

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # The full suite, not just a compile: nothing should be published that does not pass it.
      - name: Build and test
        run: mvn --batch-mode clean verify

      - name: Package the browser extension
        run: cd extension && zip -r ../leetcode-coach-extension.zip . -x '.*'

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # amd64 for most servers, arm64 for Apple Silicon. The jar built above goes into both, since
      # it is architecture-independent and rebuilding it under emulation would only be slower.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only on a tag: a manual run publishes the image without creating an empty release.
      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/leetcode-coach-mcp-server-*.jar
            leetcode-coach-extension.zip
