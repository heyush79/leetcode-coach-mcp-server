services:
  leetcode-coach:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      LEETCODE_SESSION: ${LEETCODE_SESSION:-}
      LEETCODE_CSRF_TOKEN: ${LEETCODE_CSRF_TOKEN:-}
      LEETCODE_REMOTE_ENABLED: ${LEETCODE_REMOTE_ENABLED:-true}
      MCP_API_KEY: ${MCP_API_KEY:-}
      SQLITE_URL: jdbc:sqlite:/app/data/leetcode-coach.db
    volumes:
      - leetcode_coach_data:/app/data


volumes:
  leetcode_coach_data:
